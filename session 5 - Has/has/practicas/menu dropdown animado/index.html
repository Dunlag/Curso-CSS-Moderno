<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu animado</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <nav class="nav">
      <a href="#" class="nav__logo">
        <img src="./assets/logo.png" alt="logo" class="nav__logo-img" />
      </a>

      <ul class="nav__list">
        <li class="nav__element">
          <a href="#" class="nav__link nav__link--parent">Inicio</a>
        </li>

        <li class="nav__element nav__dropdown">
          <label class="nav__link nav__link--parent">
            Servicios

            <img src="./assets/arrow.svg" alt="flecha" class="nav__arrow" />

            <input type="checkbox" />
          </label>
          <div class="nav__parent-submenu">
            <ul class="nav__submenu">
              <li class="nav__element-child">
                <a href="#" class="nav__link">Servicio 1</a>
              </li>

              <li class="nav__element-child">
                <a href="#" class="nav__link">Servicio 2</a>
              </li>

              <li class="nav__element-child">
                <a href="#" class="nav__link">Servicio 3</a>
              </li>
            </ul>
          </div>
        </li>
        <li class="nav__element">
          <a href="#" class="nav__link nav__link--parent">About</a>
        </li>
        <li class="nav__element">
          <a href="#" class="nav__link nav__link--parent">Contacto</a>
        </li>
      </ul>

      <label class="nav__button">
        <input type="checkbox" class="nav__menu-input" />
      </label>
    </nav>
  </body>
</html>
