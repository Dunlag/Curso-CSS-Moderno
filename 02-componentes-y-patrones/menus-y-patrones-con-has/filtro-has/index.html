<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro de Imágenes con :has() | CSS Moderno</title>
    <link rel="stylesheet" href="./estilos.css">
    <link rel="stylesheet" href="../../../portfolio-demo.css">
</head>
<body>
    <section class="portfolio-bar">
        <div class="portfolio-bar__top">
            <a class="portfolio-bar__back" href="../../../index.html">Volver al portfolio</a>
            <p class="portfolio-bar__eyebrow">Colección con :has()</p>
        </div>
        <strong class="portfolio-bar__title">Filtro de imágenes con :has()</strong>
        <p class="portfolio-bar__summary">Galería filtrable construida solo con radio buttons y selectores modernos, sin JavaScript.</p>
        <ul class="portfolio-bar__meta">
            <li>:has()</li>
            <li>Filtering UI</li>
            <li>Pure CSS</li>
        </ul>
    </section>

    <section class="filters">

        <h2 class="filters__title">Imágenes de Mascotas</h2>

        <div class="filters__buttons">

            <label class="filters__label">
                <input type="radio" name="mascota" checked>
                Todos
            </label>

            <label  class="filters__label">
                <input type="radio" name="mascota" id="perro">
                Perro
            </label>

            <label  class="filters__label">
                <input type="radio" name="mascota" id="gato">
                Gato
            </label>

            <label  class="filters__label">
                <input type="radio" name="mascota" id="pantera">
                Pantera
            </label>


        </div>

        <section class="gallery">

            <img src="./img/perro1.jpg" class="gallery__img" data-perro>

            <img src="./img/perro2.jpg" class="gallery__img" data-perro>

            <img src="./img/perro3.jpg" class="gallery__img" data-perro>

            <img src="./img/pantera1.jpg" class="gallery__img" data-pantera>

            <img src="./img/pantera2.jpg" class="gallery__img" data-pantera>

            <img src="./img/pantera3.jpg" class="gallery__img" data-pantera>

            <img src="./img/gato1.jpg" class="gallery__img" data-gato>

            <img src="./img/gato2.jpg" class="gallery__img" data-gato>

            <img src="./img/gato3.jpg" class="gallery__img" data-gato>

        </section>

    </section>
    
</body>
</html>
